services:
  gateway:
    container_name: gateway
    image: ${DOCKER_REGISTRY-}gateway
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - userservice
      - shelfsservice
      - outfitofferservice
    networks:
      - microservice_net

  userservice:
    container_name: user-service
    image: ${DOCKER_REGISTRY-}user-service
    build:
      context: .
      dockerfile: UserService/Dockerfile
    environment:
      - ConnectionStrings__ShelfDbConnection=Host=onlineshelfdb;Database=onlineShelf_db;Username=admin;Password=admin
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - microservice_net

  shelfsservice:
    container_name: shelfs-service
    image: ${DOCKER_REGISTRY-}shelfs-service    
    build:
      context: .
      dockerfile: ShelfsService/Dockerfile
    ports:
     - "8081:8080"   # REST
     - "8082:8082"   # gRPC Wardrobe (h2c) для outfitofferservice
    environment:
     - ConnectionStrings__ShelfDbConnection=Host=onlineshelfdb;Database=onlineShelf_db;Username=admin;Password=admin
     - GrpcConfigs__ImageServiceUrl=http://imageservice:8080
     - GrpcSettings__ParseImageServiceUrl=http://parseimageservice:50051
     - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - microservice_net

  outfitofferservice:
    container_name: outfit-offer-service
    image: ${DOCKER_REGISTRY-}outfit-offer-service
    build:
      context: .
      dockerfile: OutfitOfferService/Dockerfile
    ports:
      - "8083:8080"
    environment:
      - GrpcSettings__ShelfsServiceUrl=http://shelfsservice:8082
      - GrpcSettings__OutfitNetworkServiceUrl=http://outfitnetworkservice:8080
    depends_on:
      - shelfsservice
      - outfitnetworkservice
    networks:
      - microservice_net

  outfitnetworkservice:
    container_name: outfit-network-service
    image: ${DOCKER_REGISTRY-}outfit-network-service
    build:
      context: .
      dockerfile: OutfitNetworkService/Dockerfile
    networks:
      - microservice_net

  onlineshelfdb:
    container_name: online-shelf-db
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: onlineShelf_db
      TZ: Europe/Kyiv
    ports:
      - "5432:5432"
    networks:
      - microservice_net

  imageservice:
    container_name: image-service
    image: ${DOCKER_REGISTRY-}image-service
    build:
      context: .
      dockerfile: ImageService/Dockerfile
    ports:
      - "8080:8080"  
    volumes:
      - D:/visualStudio/Projects/OnlineShelf/images:/app/images
    networks:
      - microservice_net 

  parseimageservice:
    container_name: parse-image-service
    image: ${DOCKER_REGISTRY-}parse-image-service
    build:
      context: .
      dockerfile: ParseImageService/Dockerfile
    ports:
      - "50051:50051"
    environment:
      - ENV=production
      - SHELF_SERVICE_URL=http://gateway:8080
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    networks:
      - microservice_net

  adminportal:
    container_name: admin-portal
    image: ${DOCKER_REGISTRY-}admin-portal
    build:
      context: ../../frontend/admin-portal
      dockerfile: Dockerfile
    ports:
      - "5173:80"   # CORS у Gateway дозволяє саме http://localhost:5173
    depends_on:
      - gateway
    networks:
      - microservice_net

networks:
  microservice_net:
    driver: bridge