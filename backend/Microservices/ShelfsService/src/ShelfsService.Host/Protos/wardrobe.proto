syntax = "proto3";

option csharp_namespace = "ShelfsService.Protos";

package wardrobe;

// Внутрішній контракт для OutfitOfferService: гардероб користувача разом із візуальними ембедингами
service Wardrobe {
  rpc GetWardrobe (GetWardrobeRequest) returns (GetWardrobeResponse);
}

message GetWardrobeRequest {
  string user_id = 1;
  bool only_favorite = 2;
}

message WardrobeItem {
  string item_id = 1;
  string name = 2;
  string shelf_id = 3;
  string big_image = 4;
  bool is_favorite = 5;

  string attribute_color_main = 6;
  string attribute_color_second = 7;
  int32 attribute_type = 8;
  int32 attribute_season = 9;
  int32 attribute_pattern = 10;
  int32 attribute_material = 11;

  repeated float visual_embedding = 12;  // порожній, якщо ембединг ще не пораховано
  string embedding_model = 13;
}

message GetWardrobeResponse {
  repeated WardrobeItem items = 1;
}
