syntax = "proto3";
option csharp_namespace = "OutfitNetworkService.Protos";

// OutfitNetworkService — лише модель: рахує сумісність речей усередині образу.
// Генерація кандидатів, фільтри та бізнес-логіка живуть в OutfitOfferService.
service OutfitNetworkService {
  rpc ScoreOutfit (ScoreOutfitGrpcRequest) returns (ScoreOutfitGrpcResponse);

  // Пакетна оцінка: один мережевий виклик на крок beam search замість виклику на кожного кандидата
  rpc ScoreOutfits (ScoreOutfitsGrpcRequest) returns (ScoreOutfitsGrpcResponse);
}

message ScoreOutfitGrpcRequest {
  repeated ItemNode items = 1;
}

message ScoreOutfitsGrpcRequest {
  repeated ScoreOutfitGrpcRequest outfits = 1;
}

message ScoreOutfitsGrpcResponse {
  repeated ScoreOutfitGrpcResponse results = 1;   // у тому ж порядку, що й outfits у запиті
}

message ItemNode {
  string item_id = 1;
  int32 attribute_type = 2;
  bool is_virtual = 3;
  bool is_pinned = 4;
  repeated float feature_vector = 5;   // візуальний ембединг; порожній, якщо ще не пораховано
  string attribute_color_main = 6;
  string attribute_color_second = 7;
  int32 attribute_season = 8;
  int32 attribute_pattern = 9;
  int32 attribute_matterial = 10;
}

message ScoreOutfitGrpcResponse {
  double final_score = 1;
  double graph_level_score = 2;
  double penalty_multiplier = 3;
  map<string, double> applied_penalties = 4;
  repeated PairwiseScore pairwise_scores = 5;
}

message PairwiseScore {
  string item_id_a = 1;
  string item_id_b = 2;
  double score = 3;
}
