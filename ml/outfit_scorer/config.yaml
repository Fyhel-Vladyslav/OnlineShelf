# Конфігурація ML-пайплайна скорера сумісності образів.
# Відносні шляхи рахуються від кореня репозиторію.

paths:
  # Робоча тека: кеш ембедингів, чекпоінти, прогони (у .gitignore).
  data_dir: ml/data
  # Сирий датасет Polyvore Outfits. Перевизначається змінною середовища POLYVORE_DIR.
  polyvore_dir: ml/data/polyvore_outfits

dataset:
  # Основний варіант сплітів (чесніша оцінка); nondisjoint — опційно.
  variant: disjoint

# semantic_category (Polyvore) → OutfitSlot (OutfitOfferService.Common/Models/OutfitSlot.cs).
# Категорії, яких тут немає, відкидаються.
category_map:
  tops: Top
  bottoms: Bottom
  all-body: FullBody
  shoes: Shoes
  outerwear: Outerwear
  bags: Accessory
  accessories: Accessory
  jewellery: Accessory
  hats: Accessory
  sunglasses: Accessory
  scarves: Accessory

# Значення enum OutfitSlot; має збігатися з .NET.
outfit_slots:
  Unknown: 0
  Top: 1
  Bottom: 2
  FullBody: 3
  Shoes: 4
  Outerwear: 5
  Accessory: 6

embedding:
  model: openai/clip-vit-base-patch32
  dim: 512
  # fp16 через torch.autocast (лише на CUDA). Перед повним прогоном: embed.py --check-fp16.
  precision: fp16
  batch_size: 128
  # Потоки декодування JPEG і препроцесингу CLIP (PIL і numpy відпускають GIL).
  num_workers: 4
  # Скільки айтемів у частині кешу; після кожної частини прогрес зберігається на диск.
  shard_size: 4096

model:
  hidden_dim: 256
  dim: 64
  num_masks: 5
  category_vocab: 7      # OutfitSlot 0..6
  category_emb_dim: 32
  gnn_rounds: 2          # 0 = pairwise без GNN (baseline): graph_score = середнє s_ij
  dropout: 0.1

train:
  seed: 42
  epochs: 30
  patience: 5            # early stopping за valid compat AUC
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  edge_loss_weight: 0.3
  template_prob: 0.5     # частка позитивів-підобразів під шаблони OfferService
  max_nodes: 8           # довші образи обрізаються випадковою підмножиною
  replace_min: 1         # скільки айтемів замінювати в негативі
  replace_max: 2
  drop_embedding_prob: 0.1
  noise_std: 0.01        # гаусівський шум на L2-нормовані ембединги (потім ренормалізація)
  num_workers: 0
